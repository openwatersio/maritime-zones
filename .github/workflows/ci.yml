name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The vitest suite needs dist/, which means downloading every layer from
      # VLIZ; it runs locally. See CONTRIBUTING.md.
      - run: npx tsc -p .
      - run: npx vitest run test/regulations.test.ts
      - run: npm run demo:build
  performance:
    runs-on: ubuntu-latest
    # About 11 minutes on a 20-core M1 Ultra; a 4-core runner needs headroom.
    timeout-minutes: 45
    permissions: { contents: read }
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Skip unless the queries, the harness or the toolchain changed
        id: changes
        run: |
          if git diff --name-only "$BASE...HEAD" | grep -qE '^(src|benchmarks)/|^package(-lock)?\.json$|^\.github/workflows/ci\.yml$'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - if: steps.changes.outputs.run == 'true'
        run: npm ci
      # The reader checks tiles against these hashes, so they must come from the release it downloads from.
      - if: steps.changes.outputs.run == 'true'
        run: gh release download "v$(node -p "require('./package.json').version")" -p tiles.json -p zones.json -D dist
      - if: steps.changes.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/openwaters/maritime-zones
          key: tiles-${{ hashFiles('package.json', 'benchmarks/cases.json') }}
      - if: steps.changes.outputs.run == 'true'
        name: Compare base and candidate on the same runner
        run: node benchmarks/run.ts --base "$BASE" --output benchmark-results
      - if: always() && steps.changes.outputs.run == 'true'
        name: Publish timing table
        run: cat benchmark-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance
          path: benchmark-results
          retention-days: 30
