name: Ubuntu 26.04 native compressor validation

on:
  pull_request:
    paths: [".github/workflows/ubuntu-native-tools.yml"]

permissions:
  contents: read

jobs:
  native-tools:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies and report versions
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libzstd-dev cmake zstd
          ogr2ogr --version
          cmake --version
          cc --version
          zstd --version
      - name: Build the production compressor
        run: |
          curl -fL https://github.com/martinellimarco/t2sz/archive/refs/tags/v1.2.5.tar.gz -o "$RUNNER_TEMP/t2sz.tar.gz"
          echo "4bdc590a8a2085951cfbe83ef6ab22b5fd4723163662e1aae41260c0b5a49a01  $RUNNER_TEMP/t2sz.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/t2sz.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/t2sz-1.2.5" -B "$RUNNER_TEMP/t2sz-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/t2sz-build"
      - name: Run bounded upstream self-tests
        run: |
          cmake -S "$RUNNER_TEMP/t2sz-1.2.5" -B "$RUNNER_TEMP/t2sz-tests" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          cmake --build "$RUNNER_TEMP/t2sz-tests"
          ctest --test-dir "$RUNNER_TEMP/t2sz-tests" --output-on-failure -E '^(raw_1gb|tar_500mb)$'
