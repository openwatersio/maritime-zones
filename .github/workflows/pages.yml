name: Deploy demos

on:
  push:
    branches: [main]
    paths:
      - demo/**
      - src/**
      - scripts/build-demo.ts
      - package*.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - run: npm ci
      - name: Use the existing tile release
        run: |
          TAG="v$(node -p "require('./package.json').tileVersion")"
          TILE_VERSION="$TAG" npm run demo:build
          mkdir -p "public/$TAG"
          gh release download "$TAG" --dir "public/$TAG"
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deploy
