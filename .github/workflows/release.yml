name: Release tiles

# Builds the tiles from the VLIZ WFS and publishes them as assets on the GitHub
# release v<package.json version>, where the reader downloads them from.
# Manual only, and a dry run unless told otherwise. No npm publishing.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test only; publish nothing
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install GDAL
        run: sudo apt-get update && sudo apt-get install -y gdal-bin && ogr2ogr --version
      - name: Install t2sz
        run: |
          sudo apt-get install -y libzstd-dev cmake
          curl -fL https://github.com/martinellimarco/t2sz/archive/refs/tags/v1.2.5.tar.gz -o "$RUNNER_TEMP/t2sz.tar.gz"
          echo "4bdc590a8a2085951cfbe83ef6ab22b5fd4723163662e1aae41260c0b5a49a01  $RUNNER_TEMP/t2sz.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/t2sz.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/t2sz-1.2.5" -B "$RUNNER_TEMP/t2sz-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/t2sz-build"
          echo "$RUNNER_TEMP/t2sz-build" >> "$GITHUB_PATH"
      - run: npm ci

      - name: Choose the release tag
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Consumers cache tiles by version and check them against the hashes
          # shipped with that version, so a published release is never replaced.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::Release $TAG already exists. Bump the version in package.json to release new tiles."
            exit 1
          fi

      - name: Fetch maritime boundaries and OSM coastlines
        run: npm run fetch
      - name: Check upstream matches the committed lock
        run: |
          # Only data that was reviewed in a pull request gets released.
          if ! git diff --exit-code upstream.lock.json; then
            echo "::error::Upstream data differs from upstream.lock.json. Commit the new lock in a pull request first."
            exit 1
          fi

      - name: Build tiles
        run: npm run build
      - name: Test against the new tiles
        run: npm test

      - name: Write release notes
        run: node scripts/release-notes.ts | tee "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        run: |
          # Draft first, so nobody sees a release with half its tiles.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          node scripts/upload-release.ts "$TAG"
          EXPECTED=$(node -p "Object.keys(require('./dist/tiles.json').tiles).length + 3")
          UPLOADED=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$UPLOADED" -ne "$EXPECTED" ]; then
            echo "::error::Uploaded $UPLOADED of $EXPECTED assets; leaving $TAG as a draft."
            exit 1
          fi
          gh release edit "$TAG" --draft=false --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Verify a query from a fresh release cache
        if: ${{ !inputs.dry_run }}
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { mkdtemp, rm } from "node:fs/promises";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import { configure, whereAmI } from "./src/index.ts";
          console.debug = () => {};
          const cacheDir = await mkdtemp(join(tmpdir(), "maritime-zones-release-"));
          try {
            configure({ cacheDir });
            assert.deepEqual((await whereAmI(51.25, 2.85)).map(z => `${z.layer}:${z.iso_ter}`), ["12nm:BEL", "eez:BEL"]);
          } finally {
            await rm(cacheDir, { recursive: true, force: true });
          }
          JS

      - name: Prepare the Pages mirror
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p "public/$TAG"
          cp dist/tiles/*.fgb.zst dist/tiles.json dist/zones.json NOTICE "public/$TAG/"
          TILE_VERSION="$TAG" npm run demo:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ !inputs.dry_run }}
        with:
          path: public

  pages:
    if: ${{ !inputs.dry_run }}
    needs: release
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
