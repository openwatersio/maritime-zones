name: Release tiles

# Builds the tiles from the VLIZ WFS and publishes them as assets on the GitHub
# release v<package.json version>, where the reader downloads them from.
# Manual only, and a dry run unless told otherwise: publishing waits on VLIZ
# confirming that derived tiles may be redistributed.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test only; publish nothing
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install GDAL
        run: sudo apt-get update && sudo apt-get install -y gdal-bin && ogr2ogr --version
      - run: npm ci

      - name: Choose the release tag
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Consumers cache tiles by version and check them against the hashes
          # shipped with that version, so a published release is never replaced.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version in package.json to release new tiles."
            exit 1
          fi

      - name: Fetch every layer from the VLIZ WFS
        run: npm run fetch
      - name: Check upstream matches the committed lock
        run: |
          # Only data that was reviewed in a pull request gets released.
          if ! git diff --exit-code upstream.lock.json; then
            echo "::error::Marine Regions data differs from upstream.lock.json. Commit the new lock in a pull request first."
            exit 1
          fi

      - name: Build tiles
        run: npm run build
      - name: Test against the new tiles
        run: npm test

      - name: Write release notes
        run: node scripts/release-notes.ts | tee "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        run: |
          # Draft first, so nobody sees a release with half its tiles.
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" dist/zones.json dist/tiles.json dist/tiles/*.fgb
          EXPECTED=$(node -p "Object.keys(require('./dist/tiles.json').tiles).length + 2")
          UPLOADED=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$UPLOADED" -ne "$EXPECTED" ]; then
            echo "::error::Uploaded $UPLOADED of $EXPECTED assets; leaving $TAG as a draft."
            exit 1
          fi
          gh release edit "$TAG" --draft=false
