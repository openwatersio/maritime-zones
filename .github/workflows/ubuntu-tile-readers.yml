name: Ubuntu released tile reader validation

on:
  pull_request:
    paths: [".github/workflows/ubuntu-tile-readers.yml"]

permissions:
  contents: read

jobs:
  readers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
      - run: npm ci
      - name: Download the repository-pinned published tile set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node -p "'v' + JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).tileVersion")
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '{id,tag_name,published_at,immutable}'
          mkdir -p dist/tiles
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p tiles.json -p zones.json -D dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.fgb.zst' -D dist/tiles
          sha256sum dist/tiles.json dist/zones.json
      - name: Verify every tile against the published index
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const { tiles } = JSON.parse(readFileSync('dist/tiles.json', 'utf8'));
          assert.ok(Object.keys(tiles).length > 0);
          assert.deepEqual(readdirSync('dist/tiles').sort(), Object.keys(tiles).map(key => `${key}.fgb.zst`).sort());
          let total = 0;
          for (const [key, expected] of Object.entries(tiles)) {
            assert.match(key, /^[ns]\d+[ew]\d+$/);
            const bytes = readFileSync(`dist/tiles/${key}.fgb.zst`);
            assert.equal(bytes.length, expected.bytes, key);
            assert.equal(createHash('sha256').update(bytes).digest('hex'), expected.sha256, key);
            total += bytes.length;
          }
          console.log(`Verified ${Object.keys(tiles).length} tiles, ${total} bytes`);
          JS
      - name: Run published-data query, cache and range-reader tests
        run: npx --no-install vitest run test/queries.test.ts test/store.test.ts test/browser.test.ts
